# =============================================================================
# CONTRAT OFFICIEL — PanelBridge (sens PROJET -> PANEL)
# -----------------------------------------------------------------------------
# Ce document décrit l'API que TOUT Panel (le nôtre, ou le système d'un
# repreneur) doit exposer pour qu'un projet puisse s'y connecter. Le SEUL
# consommateur de cette API est le composant PanelBridge embarqué dans le
# backend de chaque projet (backend/src/services/panelBridge/).
#
# Références d'architecture :
#   docs/panelXvitrine/01_PANEL_CONNECTOR.md  (philosophie du PanelBridge)
#   docs/panelXvitrine/11_DONNEES_CENTRALISEES.md §1.1 (règles de synchro)
#   docs/panelXvitrine/09_AUTHENTIFICATION_PANEL_MANAGER.md (jeton {admin,dev})
#
# Versionnement du contrat :
#   - version sémantique portée par info.version ET par le header
#     X-Bridge-Contract-Version présent sur CHAQUE requête et CHAQUE réponse ;
#   - même MAJEURE exigée des deux côtés ; une mineure supérieure côté serveur
#     est acceptable (évolutions additives uniquement) ;
#   - majeure inconnue -> refus propre : 409 BRIDGE_CONTRACT_VERSION_UNSUPPORTED.
#
# Enveloppes :
#   - succès : { "success": true,  "data": ... }
#   - erreur : { "success": false, "code": "...", "message": "...", "details"? }
#   (identiques aux conventions du backend du projet — voir ErrorResponse).
#
# Historique des versions du contrat :
#   1.0.0 (Phase 1)  — surface initiale.
#   1.1.0 (Phase 2A) — ADDITIF : BootstrapRequest.manifest (optionnel) — le
#     projet se présente complètement dès l'appairage via son manifeste
#     officiel (schéma ProjectManifest, identique aux deux specs).
#     Compatible 1.0.x.
#   1.2.0 (Phase 3A) — ADDITIF, SUPERVISION EN LECTURE SEULE :
#     Heartbeat.runtime (uptime, charge, composants), Heartbeat.engines,
#     ProjectManifest.engines / .network / .descriptor. Tous OPTIONNELS :
#     un projet qui ne les publie pas reste pleinement conforme.
#     Compatible 1.0.x et 1.1.x.
#   1.3.0 (Phase 4) — ADDITIF, DÉCOUVERTE DESCENDANTE :
#     BootstrapResponse.company (CompanyProfile), .integratedApis
#     (IntegratedApiConfig[]) et .syncCursor. Le projet repart de l'appairage
#     en sachant qui il représente et avec quels accès, sans attendre un
#     premier pull. Tous OPTIONNELS : un Panel qui ne les sert pas reste
#     conforme, un projet qui les ignore aussi.
#     Compatible 1.0.x, 1.1.x et 1.2.x.
#   1.4.0 — RIEN DE NOUVEAU SUR CETTE SURFACE. La version accompagne l'ajout
#     de PingResponse.projectKey / .projectName côté ProjectBridge : les deux
#     contrats partagent un même numéro pour qu'un seul en-tête suffise à
#     décrire ce que parle un pont.
#     Compatible 1.0.x, 1.1.x, 1.2.x et 1.3.x.
# =============================================================================
openapi: 3.0.3
info:
  title: PanelBridge API — contrat exposé par le Panel
  description: >
    API consommée exclusivement par le PanelBridge d'un projet.
    Sens des appels : PROJET -> PANEL (HTTPS sortant du projet).
    Le Panel ne connaît jamais Mongo ; le projet ne connaît du Panel que
    cette surface.
  version: 1.4.0
servers:
  - url: https://panel.example.com
    description: >
      URL du Panel, connue du SEUL PanelBridge (saisie à l'appairage,
      pré-remplie par la duplication). Aucun autre composant du projet
      ne doit la connaître.

tags:
  - name: discovery
    description: Découverte et vivacité (sans authentification).
  - name: pairing
    description: Appairage (bootstrap) et désappairage.
  - name: heartbeat
    description: Signal de vie périodique du projet.
  - name: sync
    description: >
      Synchronisation des données de catégorie 2 (00_ECOSYSTEME §5.2) :
      push des écritures locales du projet, pull de rattrapage des écritures
      faites côté Panel. Règles : dernier écrit gagne, identités UUID,
      tombstones, anti-écho, idempotence (11_DONNEES_CENTRALISEES §1.1).

paths:
  /bridge/v1/ping:
    get:
      operationId: ping
      tags: [discovery]
      summary: Vivacité du Panel (découverte, sans authentification).
      description: >
        Utilisé par le PanelBridge pour distinguer « Panel injoignable »
        (état DEGRADED) de « credentials refusés ». Ne divulgue rien.
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
      responses:
        '200':
          description: Le Panel est vivant.
          headers:
            X-Bridge-Contract-Version:
              $ref: '#/components/headers/ContractVersionHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'

  /bridge/v1/pairings:
    post:
      operationId: bootstrapPairing
      tags: [pairing]
      summary: Bootstrap — appairage initial d'un projet.
      description: >
        Premier échange projet -> Panel. Le projet se présente avec un
        code d'appairage obtenu hors-bande (affiché par le Panel à la création
        du projet dans son registre). En retour, le Panel délivre le
        bridgeToken : credential PROPRE À CE PROJET, révocable
        individuellement, stocké chiffré côté projet (AES-256-GCM,
        INTEGRATED_API_ENCRYPTION_KEY). L'appairage est rejouable :
        un désappairage propre ramène à l'état UNCONFIGURED.
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
      responses:
        '201':
          description: Projet appairé ; credentials délivrés.
          headers:
            X-Bridge-Contract-Version:
              $ref: '#/components/headers/ContractVersionHeader'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          description: Code d'appairage invalide ou expiré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: BRIDGE_PAIRING_CODE_INVALID
                message: Code d'appairage invalide ou expiré.
        '409':
          description: >
            Projet déjà appairé (BRIDGE_ALREADY_PAIRED) ou version majeure du
            contrat non supportée (BRIDGE_CONTRACT_VERSION_UNSUPPORTED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bridge/v1/pairings/current:
    delete:
      operationId: unpair
      tags: [pairing]
      summary: Désappairage — le projet se débranche volontairement.
      description: >
        Révoque les credentials du projet côté Panel. IDEMPOTENT : désappairer
        un projet déjà désappairé répond 200. Après cet appel, le projet purge
        son outbox et efface son bridgeToken (04_STANDALONE §4.1) ; toute
        requête ultérieure avec l'ancien token répond 401.
      security:
        - bridgeToken: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
      responses:
        '200':
          description: Désappairé (ou l'était déjà).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpairResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bridge/v1/heartbeats:
    post:
      operationId: heartbeat
      tags: [heartbeat]
      summary: Signal de vie périodique du projet.
      description: >
        Léger, best-effort, jamais bloquant côté projet. Alimente la
        supervision du Panel (projet vivant, version déployée, dérive).
        Un heartbeat manqué ne déclenche RIEN côté projet : il fait seulement
        passer son PanelBridge CONNECTED -> DEGRADED après un seuil.
      security:
        - bridgeToken: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Heartbeat'
      responses:
        '200':
          description: Heartbeat enregistré.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatAckEnvelope'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ContractVersionUnsupported'

  /bridge/v1/sync/push:
    post:
      operationId: pushChanges
      tags: [sync]
      summary: Push — le projet livre ses écritures locales (vidage d'outbox).
      description: >
        Livre un lot ordonné de SyncChange émis par le PROJET (emitter=PROJECT).
        IDEMPOTENT par writeId : relivrer un lot déjà traité répond DUPLICATE
        pour chaque écriture, sans effet. Le Panel répond un accusé PAR
        écriture — jamais un échec global silencieux.
      security:
        - bridgeToken: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Accusés de réception, un par écriture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponseEnvelope'
        '400':
          $ref: '#/components/responses/InvalidPayload'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ContractVersionUnsupported'
        '429':
          $ref: '#/components/responses/RateLimited'

  /bridge/v1/sync/pull:
    get:
      operationId: pullChanges
      tags: [sync]
      summary: Pull — rattrapage des écritures faites côté Panel.
      description: >
        Renvoie, dans l'ordre, les SyncChange émis côté Panel (emitter=PANEL)
        depuis le curseur fourni — en EXCLUANT les écritures dont ce projet est
        l'émetteur d'origine (anti-écho, 11_DONNEES_CENTRALISEES §1.1 règle 4).
        Le curseur est OPAQUE : le projet le stocke tel quel et le renvoie.
        Chemin de robustesse : un projet resté éteint se resynchronise
        entièrement par ce seul endpoint.
      security:
        - bridgeToken: []
      parameters:
        - $ref: '#/components/parameters/ContractVersion'
        - name: cursor
          in: query
          required: false
          description: Curseur opaque de la dernière page consommée (absent = depuis le début).
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Taille de page maximale souhaitée.
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '200':
          description: Page d'écritures à appliquer localement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/ContractVersionUnsupported'

components:
  securitySchemes:
    bridgeToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        bridgeToken délivré au bootstrap — propre à UN projet, révocable
        individuellement, jamais journalisé en clair (discipline de masquage
        du projet : maskSensitiveText / createRedactor).

  parameters:
    ContractVersion:
      name: X-Bridge-Contract-Version
      in: header
      required: true
      description: >
        Version sémantique du contrat parlée par l'appelant (ex. « 1.0.0 »).
        Majeure différente -> 409 BRIDGE_CONTRACT_VERSION_UNSUPPORTED.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        example: 1.0.0

  headers:
    ContractVersionHeader:
      description: Version du contrat parlée par le serveur.
      schema:
        type: string
        example: 1.0.0

  responses:
    Unauthorized:
      description: bridgeToken absent, invalide ou révoqué.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BRIDGE_UNAUTHORIZED
            message: Credentials de pont invalides ou révoqués.
    InvalidPayload:
      description: Corps de requête non conforme au contrat (DTO invalide).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BRIDGE_INVALID_PAYLOAD
            message: Payload non conforme au contrat.
    ContractVersionUnsupported:
      description: Version majeure du contrat non supportée.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BRIDGE_CONTRACT_VERSION_UNSUPPORTED
            message: Version majeure du contrat non supportée.
    RateLimited:
      description: Trop de requêtes ; le PanelBridge réessaie avec backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            code: BRIDGE_RATE_LIMITED
            message: Trop de requêtes, réessayez plus tard.

  schemas:
    # ------------------------------------------------------------ enveloppes
    ErrorResponse:
      type: object
      description: >
        Enveloppe d'erreur commune. `code` appartient au catalogue fermé
        BRIDGE_* ci-dessous — les clients routent sur `code`, jamais sur le
        libellé français de `message`.
      required: [success, code, message]
      properties:
        success: { type: boolean, enum: [false] }
        code:
          type: string
          description: Code stable du catalogue d'erreurs du contrat.
          enum:
            - BRIDGE_UNAUTHORIZED
            - BRIDGE_ENVIRONMENT_MISMATCH
            - BRIDGE_PAIRING_CODE_INVALID
            - BRIDGE_ALREADY_PAIRED
            - BRIDGE_NOT_PAIRED
            - BRIDGE_CONTRACT_VERSION_UNSUPPORTED
            - BRIDGE_INVALID_PAYLOAD
            - BRIDGE_OPERATION_UNKNOWN
            - BRIDGE_OPERATION_FAILED
            - BRIDGE_RATE_LIMITED
            - BRIDGE_INTERNAL
        message: { type: string }
        details: { description: Contexte facultatif (objet ou tableau)., nullable: true }

    PingResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [status, service, time]
          properties:
            status: { type: string, enum: [ok] }
            service: { type: string, enum: [panel-bridge-api] }
            time: { type: string, format: date-time }

    # -------------------------------------------------------------- pairing
    BootstrapRequest:
      type: object
      description: Le projet se présente. Aucun secret du projet n'est transmis.
      required: [contractVersion, projectKey, projectName, environment, softwareVersion, pairingCode]
      properties:
        contractVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          description: Version du contrat parlée par le PanelBridge.
        projectKey:
          type: string
          minLength: 3
          maxLength: 120
          description: Identifiant stable et lisible du projet (ex. « sb-auto-06 »).
        projectName:
          type: string
          description: Nom d'affichage (ex. « SB Auto 06 »).
        environment:
          type: string
          enum: [TEST, PROD]
          description: ENV applicatif du backend qui s'appaire (informatif).
        softwareVersion:
          type: string
          description: Version déployée du projet (manifeste /api/version).
        publicBackendUrl:
          type: string
          format: uri
          nullable: true
          description: >
            URL publique du backend si connue — permet au Panel d'appeler le
            ProjectBridge (ProjectBridge.openapi.yaml). Peut être null (projet
            en local) : le Panel fonctionnera alors en pull-only.
        pairingCode:
          type: string
          description: Code d'appairage à usage unique, obtenu hors-bande.
        manifest:
          allOf:
            - $ref: '#/components/schemas/ProjectManifest'
          description: >
            OPTIONNEL (contrat ≥ 1.1.0) : le manifeste officiel du projet,
            joint dès l'appairage pour que le Panel n'ait RIEN à déduire.
            Le Panel peut aussi le (re)lire à tout moment via
            GET /api/project-bridge/v1/manifest (ProjectBridge.openapi.yaml).

    # ProjectManifest : IDENTIQUE des deux côtés (servi par GET /manifest du
    # ProjectBridge). Toute évolution s'applique aux DEUX fichiers — verrouillé
    # par bridge-conformity.test.js.
    ProjectManifest:
      type: object
      description: >
        Manifeste officiel du projet — le Panel ne déduit JAMAIS ces
        informations. `manifestVersion` versionne le FORMAT du manifeste,
        indépendamment de la version du contrat.
      required: [manifestVersion, project, bridge, contracts, sync, modules, features]
      properties:
        manifestVersion:
          type: string
          pattern: '^\d+\.\d+\.\d+$'
          example: 1.0.0
        project:
          type: object
          required: [key, name, environment, softwareVersion]
          properties:
            key: { type: string, minLength: 3, maxLength: 120 }
            name: { type: string }
            environment: { type: string, enum: [TEST, PROD] }
            softwareVersion: { type: string, description: SHA git court du build. }
        bridge:
          type: object
          required: [contractVersion, projectBridgeBasePath]
          properties:
            contractVersion:
              type: string
              pattern: '^\d+\.\d+\.\d+$'
            projectBridgeBasePath:
              type: string
              example: /api/project-bridge/v1
        contracts:
          type: object
          required: [panelBridge, projectBridge]
          properties:
            panelBridge: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            projectBridge: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        sync:
          type: object
          required: [supportedEntityTypes, operations]
          properties:
            supportedEntityTypes:
              type: array
              items:
                type: string
                enum:
                  - DIAGNOSTIC
                  - CONTRACT
                  - INVOICE
                  - PAYMENT
                  - CONTRACT_DOCUMENT
                  - DEV_COMPANY
                  - TEAM_MEMBER
                  - EMAIL_TEMPLATE
                  - INTEGRATED_API_CONFIG
                  - INTEGRATED_API_MODE
                  - EVENT
                  - MEETING
                  - PROJECT_PRESENTATION
            operations:
              type: array
              items: { type: string }
        modules:
          type: array
          items:
            type: object
            required: [id, title, status]
            properties:
              id: { type: string }
              title: { type: string }
              status: { type: string, enum: [ACTIVE, OPTIONAL] }
        features:
          type: array
          items:
            type: object
            required: [id, status]
            properties:
              id: { type: string }
              status: { type: string, enum: [AVAILABLE, RESERVED] }
        engines:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.2.0) : versions des moteurs standards
            embarques par ce projet.
          properties:
            deployment: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            duplication: { type: string, pattern: '^\d+\.\d+\.\d+$' }
        network:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.2.0) : identite reseau publique du projet,
            telle que LUI la connait. Le Panel l'affiche, ne la modifie jamais.
            Depuis 1.4.x, les cles `website`, `manager` et `backend` sont
            NORMALISEES : le Panel n'a plus a deviner laquelle designe le site
            du client. `primaryDomain` est le domaine du SITE quand il est
            connu, celui de l'API a defaut.
          properties:
            primaryDomain: { type: string, nullable: true }
            urls:
              type: object
              description: >
                Cles conventionnelles : website (site public), manager
                (administration), backend (API). Toute autre cle reste
                autorisee et simplement ignoree par le Panel.
              additionalProperties: { type: string }
        presentation:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.4.x) : identite COMMERCIALE du projet, telle
            que le client la reconnait. Sans elle, le Panel affiche le nom
            technique du projet et l'URL de son API comme s'il s'agissait du
            client et de son site. Tous les champs sont facultatifs : un projet
            qui n'en publie aucun reste pleinement conforme. Les URL de medias
            sont TOUJOURS absolues et joignables (voir
            docs/panelXvitrine/MEDIAS_PUBLICS.md) : le Panel ne copie aucun
            fichier et ne stocke aucun media.
          properties:
            companyName: { type: string, description: 'Nom commercial de l''entreprise cliente.' }
            tagline: { type: string, description: 'Slogan ou phrase de presentation.' }
            logoUrl: { type: string, format: uri, description: 'URL absolue du logo principal.' }
            faviconUrl: { type: string, format: uri, description: 'URL absolue de l''icone d''onglet.' }
            contacts:
              type: object
              description: >
                Uniquement les moyens de contact ACTIVES et renseignes. Les
                reseaux sociaux et metadonnees du catalogue ne sont pas
                transportes.
              properties:
                email: { type: string }
                phone: { type: string }
                website: { type: string }
        descriptor:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.2.0) : carte de visite du projet pour la
            supervision (type de produit, description courte, layout).
          properties:
            name: { type: string, description: 'OPTIONNEL (>= 1.4.x) : nom lisible du projet.' }
            type: { type: string, description: 'Ex. vitrine, panel, api.' }
            description: { type: string }
            layout: { type: string, description: 'Topologie declaree par le profil du moteur.' }

    BootstrapResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          $ref: '#/components/schemas/BootstrapResponse'

    BootstrapResponse:
      type: object
      required: [projectId, bridgeToken, panel]
      properties:
        projectId:
          type: string
          format: uuid
          description: Identité du projet dans le registre du Panel.
        bridgeToken:
          type: string
          description: >
            Credential du projet — stocké chiffré côté projet, jamais affiché.
            Sert aux deux sens : Authorization Bearer du PanelBridge, ET clé de
            vérification des requêtes entrantes du Panel sur le ProjectBridge
            (09_AUTHENTIFICATION_PANEL_MANAGER §4 : un seul secret d'appairage).
        panel:
          type: object
          required: [name, contractVersion]
          properties:
            name: { type: string, description: Nom d'affichage du Panel. }
            contractVersion: { type: string, description: Version du contrat parlée par le Panel. }
        # --------------------------------------------------------- >= 1.3.0
        # DÉCOUVERTE DESCENDANTE. Le projet repart de l'appairage en sachant
        # qui il représente et avec quels accès — sans attendre un premier
        # pull. OPTIONNELS : un Panel qui ne les sert pas reste conforme, et
        # un projet qui les ignore aussi.
        company:
          allOf:
            - $ref: '#/components/schemas/CompanyProfile'
          nullable: true
          description: >
            Configuration PUBLIÉE de l'entreprise que le Panel représente.
            `null` si aucune configuration n'a encore été publiée — saisir
            n'est pas publier.
        integratedApis:
          type: array
          description: >
            APIs intégrées auxquelles CE projet est autorisé, dans le mode
            correspondant à SON environnement. Un projet en TEST ne reçoit
            jamais d'identifiants PROD. Liste vide si aucune autorisation.
          items:
            $ref: '#/components/schemas/IntegratedApiConfig'
        syncCursor:
          type: string
          nullable: true
          description: >
            Curseur de synchronisation à utiliser pour le premier
            GET /bridge/v1/sync/pull. Il positionne le projet APRÈS les
            écritures déjà livrées dans cette réponse, ce qui évite de
            réappliquer la configuration au premier pull.

    # ------------------------------------------------------ entreprise >=1.3.0
    CompanyProfile:
      type: object
      description: >
        Identité publique de l'entreprise propriétaire du projet. Tout ce qui
        y figure est destiné à être affiché par un site vitrine : aucun secret
        n'y transite.
      required: [companyId, slug, environment, identity]
      properties:
        companyId: { type: string, format: uuid }
        slug: { type: string, description: Identifiant lisible et stable. }
        environment: { type: string, enum: [TEST, PROD] }
        version:
          type: integer
          description: >
            Numéro de version de la configuration publiée. Monotone. Permet au
            projet de savoir s'il est à jour, et au Panel de constater un retard.
        identity:
          type: object
          required: [name]
          properties:
            name: { type: string }
            legalName: { type: string, nullable: true }
            tagline: { type: string, nullable: true }
            description: { type: string, nullable: true }
        branding:
          type: object
          properties:
            logoUrl: { type: string, nullable: true }
            logoDarkUrl: { type: string, nullable: true }
            faviconUrl: { type: string, nullable: true }
            primaryColor: { type: string, nullable: true }
            secondaryColor: { type: string, nullable: true }
            accentColor: { type: string, nullable: true }
            fontFamily: { type: string, nullable: true }
        domains:
          type: object
          properties:
            primaryDomain: { type: string, nullable: true }
            websiteUrl: { type: string, nullable: true }
            wildcardBases: { type: array, items: { type: string } }
        contacts:
          type: object
          properties:
            email: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            supportEmail: { type: string, nullable: true }
            address:
              type: object
              properties:
                line1: { type: string, nullable: true }
                line2: { type: string, nullable: true }
                postalCode: { type: string, nullable: true }
                city: { type: string, nullable: true }
                country: { type: string, nullable: true }
        legal:
          type: object
          properties:
            legalForm: { type: string, nullable: true }
            siret: { type: string, nullable: true }
            vatNumber: { type: string, nullable: true }
            rcs: { type: string, nullable: true }
            shareCapital: { type: string, nullable: true }
            legalRepresentative: { type: string, nullable: true }
            hostingProvider: { type: string, nullable: true }
            privacyPolicyUrl: { type: string, nullable: true }
            termsUrl: { type: string, nullable: true }
        settings:
          type: object
          properties:
            locale: { type: string }
            timezone: { type: string }
            currency: { type: string }

    IntegratedApiConfig:
      type: object
      description: >
        Accès à un service tiers, délivré par le Panel à un projet AUTORISÉ.
        Le champ `credentials` porte des valeurs en clair : cette charge utile
        ne transite que sur HTTPS, vers un projet nommément autorisé, et n'est
        jamais journalisée en clair de part ni d'autre.
      required: [apiId, key, provider, mode, credentials]
      properties:
        apiId: { type: string, format: uuid }
        key: { type: string, description: Identifiant stable et lisible de l'API. }
        label: { type: string }
        provider: { type: string, description: 'Fournisseur (STRIPE, BREVO, ...).' }
        category: { type: string }
        enabled: { type: boolean }
        mode:
          type: string
          enum: [TEST, PROD]
          description: >
            Mode EFFECTIVEMENT servi, déduit de l'environnement du projet.
            Le projet doit refuser une charge utile dont le mode ne correspond
            pas au sien.
        settings:
          type: object
          additionalProperties: true
          description: Paramètres non secrets (URL de base, région, compte...).
        credentials:
          type: object
          additionalProperties: { type: string }
          description: >
            Identifiants, restreints aux clés accordées à ce projet. Un projet
            peut recevoir une clé publique sans la clé secrète.
        updatedAt: { type: string, format: date-time }

    UnpairResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [unpaired]
          properties:
            unpaired: { type: boolean, enum: [true] }

    # ------------------------------------------------------------ heartbeat
    Heartbeat:
      type: object
      required: [sentAt, softwareVersion, environment, health]
      properties:
        sentAt: { type: string, format: date-time }
        softwareVersion: { type: string }
        environment: { type: string, enum: [TEST, PROD] }
        health:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [OK, DEGRADED] }
            details: { type: string, nullable: true }
        bridgeStats:
          type: object
          description: Observabilité du pont lui-même.
          properties:
            outboxSize: { type: integer, minimum: 0 }
            lastSyncAt: { type: string, format: date-time, nullable: true }
        runtime:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.2.0) : observabilite passive du projet, pour
            la supervision en LECTURE SEULE du Panel. Aucun de ces champs n'est
            requis ; un projet qui ne les publie pas reste pleinement conforme.
          properties:
            uptimeSeconds:
              type: integer
              minimum: 0
              description: Duree depuis le dernier demarrage du backend.
            startedAt: { type: string, format: date-time, nullable: true }
            load:
              type: object
              description: Charge instantanee, telle que le projet la mesure.
              properties:
                cpuPercent: { type: number, minimum: 0 }
                memoryUsedMb: { type: number, minimum: 0 }
                memoryTotalMb: { type: number, minimum: 0 }
            components:
              type: object
              description: >
                Etat des composants internes tels que le projet les constate.
                Le Panel ne les DEDUIT jamais : il les recoit ou les ignore.
              additionalProperties:
                type: string
                enum: [OK, WARNING, ERROR, UNKNOWN]
        engines:
          type: object
          description: >
            OPTIONNEL (contrat >= 1.2.0) : versions des moteurs standards
            embarques par le projet. Permet au Panel de detecter une derive de
            version sans jamais lire le code du projet.
          properties:
            deployment: { type: string, pattern: '^\d+\.\d+\.\d+$' }
            duplication: { type: string, pattern: '^\d+\.\d+\.\d+$' }

    HeartbeatAckEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [acknowledged, panelTime]
          properties:
            acknowledged: { type: boolean, enum: [true] }
            panelTime: { type: string, format: date-time }

    # ----------------------------------------------------------------- sync
    SyncChange:
      type: object
      description: >
        UNE écriture sur une donnée synchronisée (catégorie 2). Implémente les
        règles minimales de 11_DONNEES_CENTRALISEES §1.1 : writeId = clé
        d'idempotence ET identifiant d'origine (anti-écho) ; modifiedAt =
        horodatage LWW posé par l'émetteur ; deleted=true = tombstone
        (payload alors null).
      required: [writeId, entityType, entityId, deleted, modifiedAt, emitter]
      properties:
        writeId:
          type: string
          format: uuid
          description: Identifiant unique de CETTE écriture (idempotence + anti-écho).
        entityType:
          type: string
          description: >
            Type de donnée synchronisée. En Phase 1, seul DIAGNOSTIC est
            appliqué (échange de test sans effet métier) ; les autres valeurs
            sont RÉSERVÉES pour les lots de synchronisation de la Phase 3+.
          enum:
            - DIAGNOSTIC
            - CONTRACT
            - INVOICE
            - PAYMENT
            - CONTRACT_DOCUMENT
            - DEV_COMPANY
            - TEAM_MEMBER
            - EMAIL_TEMPLATE
            - INTEGRATED_API_CONFIG
            - INTEGRATED_API_MODE
            - EVENT
            - MEETING
            - PROJECT_PRESENTATION
        entityId:
          type: string
          format: uuid
          description: Identifiant stable de la donnée, généré par le côté créateur.
        deleted:
          type: boolean
          description: true = tombstone (suppression) ; payload doit être null.
        payload:
          nullable: true
          description: >
            Contenu du document (schéma par entityType, défini lot par lot en
            Phase 3+). null si deleted=true. Aucun secret en clair.
        modifiedAt:
          type: string
          format: date-time
          description: Horodatage LWW posé par l'émetteur au moment de l'écriture.
        emitter:
          type: string
          enum: [PANEL, PROJECT]
          description: Côté qui a produit l'écriture d'ORIGINE.

    SyncPushRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncChange'

    SyncAck:
      type: object
      description: Accusé de réception d'UNE écriture.
      required: [writeId, status]
      properties:
        writeId: { type: string, format: uuid }
        status:
          type: string
          enum: [APPLIED, DUPLICATE, IGNORED, REJECTED]
          description: >
            APPLIED = appliquée ; DUPLICATE = writeId déjà vu (idempotence) ;
            IGNORED = perdante LWW ou anti-écho ; REJECTED = invalide
            (code/message précisent pourquoi).
        code: { type: string, nullable: true }
        message: { type: string, nullable: true }

    SyncPushResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                $ref: '#/components/schemas/SyncAck'

    SyncPullResponseEnvelope:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:
          type: object
          required: [changes, cursor, hasMore]
          properties:
            changes:
              type: array
              items:
                $ref: '#/components/schemas/SyncChange'
            cursor:
              type: string
              description: Curseur opaque à renvoyer au prochain pull.
            hasMore:
              type: boolean
